{% extends "layout.html" %}

{% block title %}Create account | Fever-Dreams{% endblock %}

{% block main %}
  <section class="form-shell">
    <p class="eyebrow">New player</p>
    <h1>Create your account</h1>
    <form method="post" class="stacked-form">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required maxlength="50">

      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required maxlength="254">

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required minlength="10">

      <label for="confirmation">Confirm password</label>
      <input id="confirmation" name="confirmation" type="password" autocomplete="new-password" required minlength="10">

      <button class="button" type="submit">Create account</button>
    </form>
  </section>
{% endblock %}
